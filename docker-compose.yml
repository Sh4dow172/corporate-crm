version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: crm_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432" # Пробрасываем порт 5434 наружу на стандартный 5432 внутри контейнера
    volumes:
      - postgres_data:/var/lib/postgresql/data # Данные будут жить в именованном томе

volumes:
  postgres_data: # Объявляем наш named volume
